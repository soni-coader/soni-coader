<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" aria-labelledby="tlTitle tlDesc" role="img" viewBox="0 0 1200 640">
  <title id="tlTitle">Aryant Shrirang — Technology Expertise</title>
  <desc id="tlDesc">
    Animated technology expertise card grouping the frontend, backend, AI &amp; automation, DevOps, and blockchain tools used in production work.
  </desc>
  <defs>
    <linearGradient id="tlBrandGradient" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
      <animate attributeName="x1" dur="9s" repeatCount="indefinite" values="-20%;20%;-20%"/>
      <animate attributeName="x2" dur="9s" repeatCount="indefinite" values="80%;120%;80%"/>
    </linearGradient>
    <linearGradient id="tlAiGradient" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
      <animate attributeName="x1" dur="10s" repeatCount="indefinite" values="0%;30%;0%"/>
      <animate attributeName="y2" dur="10s" repeatCount="indefinite" values="100%;70%;100%"/>
    </linearGradient>
    <linearGradient id="tlSurfaceGradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="tlGlowPrimary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tlGlowAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tlPanelClip">
      <rect width="1184" height="624" x="8" y="8" rx="28"/>
    </clipPath>
    <pattern id="tlGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path fill="none" stroke="#94a3b8" d="M42 0H0v42"/>
    </pattern>
    <filter id="tlBlur" width="220%" height="220%" x="-60%" y="-60%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <style>
