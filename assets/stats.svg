<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" aria-labelledby="gsTitle gsDesc" role="img" viewBox="0 0 800 520">
  <title id="gsTitle">Aryant Shrirang — Engineering Overview</title>
  <desc id="gsDesc">
    GitHub and engineering stats card: experience, projects built, technology breadth, open source activity, and current focus.
  </desc>
  <defs>
    <linearGradient id="gsBrandGradient" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
      <animate attributeName="x1" dur="9s" repeatCount="indefinite" values="-20%;20%;-20%"/>
      <animate attributeName="x2" dur="9s" repeatCount="indefinite" values="80%;120%;80%"/>
    </linearGradient>
    <linearGradient id="gsAiGradient" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
      <animate attributeName="x1" dur="10s" repeatCount="indefinite" values="0%;30%;0%"/>
      <animate attributeName="y2" dur="10s" repeatCount="indefinite" values="100%;70%;100%"/>
    </linearGradient>
    <linearGradient id="gsSurfaceGradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="gsGlowPrimary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gsGlowAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="gsPanelClip">
      <rect width="780" height="500" x="10" y="10" rx="28"/>
    </clipPath>
    <pattern id="gsGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path fill="none" stroke="#94a3b8" d="M42 0H0v42"/>
    </pattern>
    <filter id="gsBlur" width="220%" height="220%" x="-60%" y="-60%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <style>
    @keyframes gsGlowBreathe{0%,to{opacity:.6}50%{opacity:1}}
    @keyframes gsEnter{0%{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes gsProgressGrow{0%{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes gsIconPulse{0%,to{opacity:.55}50%{opacity:.95}}
    @keyframes gsLivePulse{0%,to{opacity:.5}50%{opacity:1}}
    @keyframes gsDriftA{0%,to{transform:translate(0,0);opacity:.25}50%{transform:translate(7px,-9px);opacity:.5}}
    @keyframes gsDriftB{0%,to{transform:translate(0,0);opacity:.2}50%{transform:translate(-8px,7px);opacity:.45}}
    @keyframes gsFocusCycle{0%,25%,to{opacity:0}2%,20%{opacity:1}}
    @keyframes gsCaretBlink{0%,45%{opacity:1}50%,to{opacity:0}}
    text{font-family:"Segoe UI","Inter",Arial,sans-serif}
    .gs-mono{font-family:"SFMono-Regular","Consolas","Courier New",monospace}
    .gs-glow-breathe{animation:gsGlowBreathe 4.2s ease-in-out infinite}
    .gs-tile{opacity:0;animation:gsEnter 650ms ease-out both}
    .gs-tile.d1{animation-delay:0ms}
    .gs-tile.d2{animation-delay:90ms}
    .gs-tile.d3{animation-delay:180ms}
    .gs-tile.d4{animation-delay:270ms}
    .gs-tile.d5{animation-delay:360ms}
    .gs-tile.d6{animation-delay:450ms}
    .gs-progress-fill{animation:gsProgressGrow 1.4s cubic-bezier(.16,.84,.44,1) both}
    .gs-progress-fill.d3{animation-delay:230ms}
    .gs-progress-fill.d4{animation-delay:320ms}
    .gs-icon-plate{animation:gsIconPulse 3.6s ease-in-out infinite}
    .gs-live-pulse{animation:gsLivePulse 3s ease-in-out infinite}
    .gs-p1{animation:gsDriftA 12s ease-in-out infinite}
    .gs-p2{animation:gsDriftB 15s ease-in-out infinite}
    .gs-p3{animation:gsDriftA 10s ease-in-out infinite}
    .gs-focusLine{opacity:0;animation:gsFocusCycle 16s linear infinite}
    .gs-focusLine.f1{animation-delay:0s}
    .gs-focusLine.f2{animation-delay:4s}
    .gs-focusLine.f3{animation-delay:8s}
    .gs-focusLine.f4{animation-delay:12s}
    .gs-caret{animation:gsCaretBlink 1.1s steps(1) infinite}
  </style>

  <rect width="780" height="500" x="16" y="16" filter="url(#gsBlur)" opacity=".35" rx="28"/>
  <ellipse cx="160" cy="90" fill="url(#gsGlowPrimary)" class="gs-glow-breathe" filter="url(#gsBlur)" rx="200" ry="140"/>
  <ellipse cx="680" cy="430" fill="url(#gsGlowAccent)" class="gs-glow-breathe" filter="url(#gsBlur)" rx="200" ry="140" style="animation-delay:1.4s"/>
  <rect width="780" height="500" x="10" y="10" fill="url(#gsSurfaceGradient)" fill-opacity=".92" rx="28"/>
  <rect width="780" height="500" x="10" y="10" fill="none" stroke="url(#gsAiGradient)" stroke-width="1.6" rx="28"/>

  <g clip-path="url(#gsPanelClip)">
    <rect width="780" height="500" x="10" y="10" fill="url(#gsGrid)" opacity=".05"/>
    <circle cx="90" cy="50" r="2" fill="#06b6d4" class="gs-p1" opacity=".3"/>
    <circle cx="720" cy="46" r="1.8" fill="#06b6d4" class="gs-p2" opacity=".28"/>
    <circle cx="740" cy="480" r="2" fill="#7c3aed" class="gs-p3" opacity=".3"/>
  </g>

  <text x="40" y="48" fill="url(#gsBrandGradient)" font-size="20" font-weight="700">Engineering Overview</text>
  <text x="40" y="68" fill="#94a3b8" font-size="11.5">Production work, stack breadth, and current focus</text>
  <circle cx="698" cy="44" r="4" fill="#22c55e" class="gs-live-pulse"/>
  <text x="710" y="48" fill="#94a3b8" class="gs-mono" font-size="10" letter-spacing="1">LIVE</text>
  <line x1="40" x2="760" y1="84" y2="84" stroke="#94a3b8" stroke-opacity=".15"/>

  <!-- Row 1 -->
  <g class="gs-tile d1">
    <rect width="236" height="170" x="40" y="104" fill="#0d1117" fill-opacity=".4" stroke="#94a3b8" stroke-opacity=".14" rx="16"/>
    <circle cx="68" cy="136" r="14" fill="#7c3aed" fill-opacity=".14" class="gs-icon-plate"/>
    <rect width="10" height="5" x="57" y="128" fill="none" stroke="#06b6d4" stroke-width="1.5" rx="1"/>
    <rect width="20" height="12" x="57" y="132" fill="none" stroke="#06b6d4" stroke-width="1.5" rx="2"/>
    <text x="40" y="198" fill="#94a3b8" fill-opacity=".75" font-size="28" font-weight="700" text-anchor="middle" dx="118">—</text>
    <text x="158" y="228" fill="#94a3b8" font-size="12" text-anchor="middle">Public Repositories</text>
    <text x="158" y="248" fill="#94a3b8" fill-opacity=".65" class="gs-mono" font-size="9" text-anchor="middle">GitHub API</text>
  </g>

  <g class="gs-tile d2">
    <rect width="236" height="170" x="292" y="104" fill="#0d1117" fill-opacity=".4" stroke="#94a3b8" stroke-opacity=".14" rx="16"/>
    <circle cx="320" cy="136" r="14" fill="#4f46e5" fill-opacity=".16" class="gs-icon-plate"/>
    <circle cx="320" cy="136" r="10" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="320" x2="320" y1="136" y2="129" stroke="#06b6d4" stroke-linecap="round" stroke-width="1.5"/>
    <line x1="320" x2="326" y1="136" y2="138" stroke="#06b6d4" stroke-linecap="round" stroke-width="1.5"/>
    <text x="410" y="198" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle">2.10+</text>
    <text x="410" y="228" fill="#94a3b8" font-size="12" text-anchor="middle">Years of Experience</text>
  </g>

  <g class="gs-tile d3">
    <rect width="236" height="170" x="544" y="104" fill="#0d1117" fill-opacity=".4" stroke="#94a3b8" stroke-opacity=".14" rx="16"/>
    <circle cx="572" cy="136" r="14" fill="#7c3aed" fill-opacity=".14" class="gs-icon-plate"/>
    <rect width="16" height="5" x="564" y="129" fill="none" stroke="#06b6d4" stroke-width="1.4" rx="1.5"/>
    <rect width="16" height="5" x="564" y="136" fill="none" stroke="#06b6d4" stroke-width="1.4" opacity=".75" rx="1.5"/>
    <rect width="16" height="5" x="564" y="143" fill="none" stroke="#06b6d4" stroke-width="1.4" opacity=".5" rx="1.5"/>
    <text x="662" y="198" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle">80+</text>
    <text x="662" y="228" fill="#94a3b8" font-size="12" text-anchor="middle">Projects Built</text>
    <rect width="180" height="4" x="572" y="248" fill="#94a3b8" fill-opacity=".15" rx="2"/>
    <rect width="164" height="4" x="572" y="248" fill="url(#gsAiGradient)" class="gs-progress-fill d3" rx="2" style="transform-box:fill-box;transform-origin:left"/>
  </g>

  <!-- Row 2 -->
  <g class="gs-tile d4">
    <rect width="236" height="170" x="40" y="290" fill="#0d1117" fill-opacity=".4" stroke="#94a3b8" stroke-opacity=".14" rx="16"/>
    <circle cx="68" cy="322" r="14" fill="#4f46e5" fill-opacity=".16" class="gs-icon-plate"/>
    <rect width="16" height="16" x="60" y="314" fill="none" stroke="#06b6d4" stroke-width="1.5" rx="3"/>
    <rect width="5" height="5" x="65.5" y="319.5" fill="#06b6d4" fill-opacity=".6"/>
    <text x="158" y="384" fill="#f8fafc" font-size="28" font-weight="700" text-anchor="middle">30+</text>
    <text x="158" y="414" fill="#94a3b8" font-size="12" text-anchor="middle">Technologies</text>
    <rect width="180" height="4" x="68" y="434" fill="#94a3b8" fill-opacity=".15" rx="2"/>
    <rect width="150" height="4" x="68" y="434" fill="url(#gsAiGradient)" class="gs-progress-fill d4" rx="2" style="transform-box:fill-box;transform-origin:left"/>
  </g>

  <g class="gs-tile d5">
    <rect width="236" height="170" x="292" y="290" fill="#0d1117" fill-opacity=".4" stroke="#94a3b8" stroke-opacity=".14" rx="16"/>
    <circle cx="320" cy="322" r="14" fill="#7c3aed" fill-opacity=".14" class="gs-icon-plate"/>
    <circle cx="314" cy="316" r="2.2" fill="none" stroke="#06b6d4" stroke-width="1.3"/>
    <circle cx="314" cy="328" r="2.2" fill="none" stroke="#06b6d4" stroke-width="1.3"/>
    <circle cx="326" cy="322" r="2.2" fill="none" stroke="#06b6d4" stroke-width="1.3"/>
    <path fill="none" stroke="#06b6d4" stroke-width="1.3" d="M314 318.2v9.6m0-4.8h9"/>
    <text x="410" y="384" fill="#94a3b8" fill-opacity=".75" font-size="28" font-weight="700" text-anchor="middle">—</text>
    <text x="410" y="414" fill="#94a3b8" font-size="12" text-anchor="middle">Open Source</text>
    <text x="410" y="434" fill="#94a3b8" fill-opacity=".65" class="gs-mono" font-size="9" text-anchor="middle">GitHub API</text>
  </g>

  <g class="gs-tile d6">
    <rect width="236" height="170" x="544" y="290" fill="#0d1117" fill-opacity=".4" stroke="#94a3b8" stroke-opacity=".14" rx="16"/>
    <circle cx="572" cy="322" r="14" fill="#4f46e5" fill-opacity=".16" class="gs-icon-plate"/>
    <circle cx="572" cy="322" r="10" fill="none" stroke="#06b6d4" stroke-width="1.3"/>
    <circle cx="572" cy="322" r="5.5" fill="none" stroke="#06b6d4" stroke-width="1.1" opacity=".7"/>
    <circle cx="572" cy="322" r="2" fill="#06b6d4"/>
    <text x="662" y="360" fill="#94a3b8" font-size="11" text-anchor="middle">Current Focus</text>
    <g class="gs-mono" font-size="10.5">
      <text x="560" y="392" fill="#06b6d4">❯</text>
      <text x="574" y="392" class="gs-focusLine f1"><tspan fill="#f8fafc">MERN · SaaS · blockchain</tspan><tspan fill="#06b6d4" class="gs-caret">▌</tspan></text>
      <text x="574" y="392" class="gs-focusLine f2"><tspan fill="#f8fafc">RAG systems &amp; LLMs</tspan><tspan fill="#06b6d4" class="gs-caret">▌</tspan></text>
      <text x="574" y="392" class="gs-focusLine f3"><tspan fill="#f8fafc">Agentic automation · n8n</tspan><tspan fill="#06b6d4" class="gs-caret">▌</tspan></text>
      <text x="574" y="392" class="gs-focusLine f4"><tspan fill="#f8fafc">React + Three.js UI</tspan><tspan fill="#06b6d4" class="gs-caret">▌</tspan></text>
    </g>
    <text x="662" y="430" fill="#94a3b8" fill-opacity=".55" font-size="9" text-anchor="middle">active project focus</text>
  </g>
</svg>
