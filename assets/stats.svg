<svg width="1200" height="350" viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gsTitle gsDesc">
  <title id="gsTitle">Aryant Shrirang — Engineering Overview</title>
  <desc id="gsDesc">GitHub and engineering stats card: experience, projects built, technology breadth, open source activity, and current focus. Repository and open-source figures are configurable slots synced from the GitHub API.</desc>

  <!-- ============================================================ -->
  <!-- DEFS — same token system as banner.svg / lanyard.svg          -->
  <!-- ============================================================ -->
  <defs>

    <linearGradient id="gsBrandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
      <animate attributeName="x1" values="-20%;20%;-20%" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80%;120%;80%" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gsAiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="100%;70%;100%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gsSurfaceGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <radialGradient id="gsGlowPrimary" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="gsGlowAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gsGrid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#94A3B8" stroke-width="1"/>
    </pattern>

    <filter id="gsBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <clipPath id="gsPanelClip">
      <rect x="8" y="8" width="1184" height="334" rx="28"/>
    </clipPath>
  </defs>

  <!-- ============================================================ -->
  <!-- STYLE                                                         -->
  <!-- ============================================================ -->
  <style>
    text { font-family: "Segoe UI", "Inter", Arial, sans-serif; }
    .gs-mono { font-family: "SFMono-Regular", "Consolas", "Courier New", monospace; }

    /* Ambient glow breathing behind the card */
    .gs-glow-breathe { animation: gsGlowBreathe 4.2s ease-in-out infinite; }
    @keyframes gsGlowBreathe {
      0%, 100% { opacity: 0.6; }
      50%      { opacity: 1; }
    }

    /* Staggered entrance = "counter fade-in" for each stat tile */
    .gs-tile { opacity: 0; animation: gsEnter 650ms ease-out both; }
    .gs-tile.d1 { animation-delay: 0ms;   }
    .gs-tile.d2 { animation-delay: 90ms;  }
    .gs-tile.d3 { animation-delay: 180ms; }
    .gs-tile.d4 { animation-delay: 270ms; }
    .gs-tile.d5 { animation-delay: 360ms; }
    .gs-tile.d6 { animation-delay: 450ms; }
    @keyframes gsEnter {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Progress line grow-in (Technologies / Projects Built) */
    .gs-progress-fill { animation: gsProgressGrow 1.4s cubic-bezier(.16,.84,.44,1) both; }
    .gs-progress-fill.d4 { animation-delay: 320ms; }
    .gs-progress-fill.d3 { animation-delay: 230ms; }
    @keyframes gsProgressGrow {
      0%   { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    /* Icon plate soft glow pulse + gentle hover response */
    .gs-icon-plate { animation: gsIconPulse 3.6s ease-in-out infinite; transition: transform 200ms ease-out; transform-origin: center; }
    .gs-icon-plate:hover { transform: scale(1.08); }
    @keyframes gsIconPulse {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 0.95; }
    }

    /* Status / live dot pulse */
    .gs-live-pulse { animation: gsLivePulse 3s ease-in-out infinite; }
    @keyframes gsLivePulse {
      0%, 100% { opacity: 0.5; }
      50%      { opacity: 1; }
    }

    /* Background particle drift */
    .gs-p1 { animation: gsDriftA 12s ease-in-out infinite; }
    .gs-p2 { animation: gsDriftB 15s ease-in-out infinite; }
    .gs-p3 { animation: gsDriftA 10s ease-in-out infinite; }
    @keyframes gsDriftA {
      0%, 100% { transform: translate(0,0); opacity: .25; }
      50%      { transform: translate(7px,-9px); opacity: .5; }
    }
    @keyframes gsDriftB {
      0%, 100% { transform: translate(0,0); opacity: .2; }
      50%      { transform: translate(-8px,7px); opacity: .45; }
    }

    /* Current Focus — crossfaded cycling line (same technique as banner typing line) */
    .gs-focusLine { opacity: 0; animation: gsFocusCycle 16s linear infinite; }
    .gs-focusLine.f1 { animation-delay: 0s;  }
    .gs-focusLine.f2 { animation-delay: 4s;  }
    .gs-focusLine.f3 { animation-delay: 8s;  }
    .gs-focusLine.f4 { animation-delay: 12s; }
    @keyframes gsFocusCycle {
      0%   { opacity: 0; }
      2%   { opacity: 1; }
      20%  { opacity: 1; }
      25%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .gs-caret { animation: gsCaretBlink 1.1s steps(1) infinite; }
    @keyframes gsCaretBlink {
      0%, 45%   { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- ============================================================ -->
  <!-- Card shadow + ambient glow                                    -->
  <!-- ============================================================ -->
  <rect x="14" y="14" width="1184" height="334" rx="28" fill="#000000" opacity="0.35" filter="url(#gsBlur)"/>
  <g class="gs-glow-breathe">
    <ellipse cx="240" cy="80" rx="260" ry="160" fill="url(#gsGlowPrimary)" filter="url(#gsBlur)"/>
  </g>
  <g class="gs-glow-breathe" style="animation-delay:1.4s">
    <ellipse cx="980" cy="290" rx="260" ry="160" fill="url(#gsGlowAccent)" filter="url(#gsBlur)"/>
  </g>

  <!-- ============================================================ -->
  <!-- Glass panel                                                   -->
  <!-- ============================================================ -->
  <rect x="8" y="8" width="1184" height="334" rx="28" fill="url(#gsSurfaceGradient)" fill-opacity="0.88"/>
  <rect x="8" y="8" width="1184" height="334" rx="28" fill="none" stroke="url(#gsAiGradient)" stroke-width="1.6"/>

  <!-- faint technical grid + sparse particles, clipped to panel -->
  <g clip-path="url(#gsPanelClip)">
    <rect x="8" y="8" width="1184" height="334" fill="url(#gsGrid)" opacity="0.05"/>
    <g fill="#06B6D4">
      <circle class="gs-p1" cx="140" cy="40"  r="2"   opacity="0.3"/>
      <circle class="gs-p2" cx="1080" cy="36" r="1.8" opacity="0.28"/>
    </g>
    <g fill="#7C3AED">
      <circle class="gs-p3" cx="1120" cy="320" r="2" opacity="0.3"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- Header                                                        -->
  <!-- ============================================================ -->
  <text x="48" y="54" font-size="22" font-weight="700" fill="url(#gsBrandGradient)">Engineering Overview</text>
  <text x="48" y="76" font-size="12.5" fill="#94A3B8">A snapshot of production work, stack breadth, and current focus</text>

  <!-- live-sync indicator -->
  <g>
    <circle cx="1088" cy="48" r="4" fill="#22C55E" class="gs-live-pulse"/>
    <text x="1100" y="52" class="gs-mono" font-size="11" letter-spacing="1" fill="#94A3B8">API-READY</text>
  </g>

  <line x1="48" y1="90" x2="1152" y2="90" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ============================================================ -->
  <!-- Stat grid — 3 columns x 2 rows, tiles 352x92                  -->
  <!-- ============================================================ -->

  <!-- Tile 1 — Public Repositories (configurable / API slot) -->
  <g class="gs-tile d1">
    <rect x="48" y="104" width="352" height="92" rx="16" fill="#0D1117" fill-opacity="0.4" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>
    <circle class="gs-icon-plate" cx="72" cy="130" r="15" fill="#7C3AED" fill-opacity="0.14"/>
    <rect x="61" y="122" width="10" height="5" rx="1" fill="none" stroke="#06B6D4" stroke-width="1.6"/>
    <rect x="61" y="126" width="22" height="14" rx="2" fill="none" stroke="#06B6D4" stroke-width="1.6"/>
    <text x="98" y="144" font-size="26" font-weight="700" fill="#94A3B8" fill-opacity="0.75">&#8212;</text>
    <text x="72" y="168" font-size="12" fill="#94A3B8">Public Repositories</text>
    <text x="72" y="182" class="gs-mono" font-size="9" fill="#94A3B8" fill-opacity="0.7">synced via GitHub API</text>
  </g>

  <!-- Tile 2 — Years of Experience -->
  <g class="gs-tile d2">
    <rect x="424" y="104" width="352" height="92" rx="16" fill="#0D1117" fill-opacity="0.4" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>
    <circle class="gs-icon-plate" cx="448" cy="130" r="15" fill="#4F46E5" fill-opacity="0.16"/>
    <circle cx="448" cy="130" r="11" fill="none" stroke="#06B6D4" stroke-width="1.6"/>
    <line x1="448" y1="130" x2="448" y2="123" stroke="#06B6D4" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="448" y1="130" x2="454" y2="132" stroke="#06B6D4" stroke-width="1.6" stroke-linecap="round"/>
    <text x="474" y="144" font-size="26" font-weight="700" fill="#F8FAFC">2.10+</text>
    <text x="448" y="168" font-size="12" fill="#94A3B8">Years of Experience</text>
  </g>

  <!-- Tile 3 — Projects Built (with progress line) -->
  <g class="gs-tile d3">
    <rect x="800" y="104" width="352" height="92" rx="16" fill="#0D1117" fill-opacity="0.4" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>
    <circle class="gs-icon-plate" cx="824" cy="130" r="15" fill="#7C3AED" fill-opacity="0.14"/>
    <rect x="815" y="123" width="18" height="6" rx="1.5" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
    <rect x="815" y="130" width="18" height="6" rx="1.5" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.75"/>
    <rect x="815" y="137" width="18" height="6" rx="1.5" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
    <text x="850" y="144" font-size="26" font-weight="700" fill="#F8FAFC">80+</text>
    <text x="824" y="168" font-size="12" fill="#94A3B8">Projects Built</text>
    <rect x="824" y="178" width="304" height="4" rx="2" fill="#94A3B8" fill-opacity="0.15"/>
    <rect class="gs-progress-fill d3" x="824" y="178" width="278" height="4" rx="2" fill="url(#gsAiGradient)" style="transform-box: fill-box; transform-origin: left;"/>
  </g>

  <!-- Tile 4 — Technologies (with progress line) -->
  <g class="gs-tile d4">
    <rect x="48" y="208" width="352" height="92" rx="16" fill="#0D1117" fill-opacity="0.4" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>
    <circle class="gs-icon-plate" cx="72" cy="234" r="15" fill="#4F46E5" fill-opacity="0.16"/>
    <rect x="63" y="225" width="18" height="18" rx="3" fill="none" stroke="#06B6D4" stroke-width="1.6"/>
    <rect x="69" y="231" width="6" height="6" fill="#06B6D4" fill-opacity="0.6"/>
    <line x1="72" y1="221" x2="72" y2="225" stroke="#06B6D4" stroke-width="1.4"/>
    <line x1="72" y1="243" x2="72" y2="247" stroke="#06B6D4" stroke-width="1.4"/>
    <line x1="59" y1="234" x2="63" y2="234" stroke="#06B6D4" stroke-width="1.4"/>
    <line x1="81" y1="234" x2="85" y2="234" stroke="#06B6D4" stroke-width="1.4"/>
    <text x="98" y="248" font-size="26" font-weight="700" fill="#F8FAFC">30+</text>
    <text x="72" y="272" font-size="12" fill="#94A3B8">Technologies</text>
    <rect x="72" y="282" width="304" height="4" rx="2" fill="#94A3B8" fill-opacity="0.15"/>
    <rect class="gs-progress-fill d4" x="72" y="282" width="256" height="4" rx="2" fill="url(#gsAiGradient)" style="transform-box: fill-box; transform-origin: left;"/>
  </g>

  <!-- Tile 5 — Open Source Contributions (configurable / API slot) -->
  <g class="gs-tile d5">
    <rect x="424" y="208" width="352" height="92" rx="16" fill="#0D1117" fill-opacity="0.4" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>
    <circle class="gs-icon-plate" cx="448" cy="234" r="15" fill="#7C3AED" fill-opacity="0.14"/>
    <circle cx="442" cy="226" r="2.4" fill="none" stroke="#06B6D4" stroke-width="1.4"/>
    <circle cx="442" cy="242" r="2.4" fill="none" stroke="#06B6D4" stroke-width="1.4"/>
    <circle cx="454" cy="234" r="2.4" fill="none" stroke="#06B6D4" stroke-width="1.4"/>
    <path d="M 442 228.4 L 442 239.6 M 442 234 Q 448 234 451.7 234" fill="none" stroke="#06B6D4" stroke-width="1.4"/>
    <text x="474" y="248" font-size="26" font-weight="700" fill="#94A3B8" fill-opacity="0.75">&#8212;</text>
    <text x="448" y="272" font-size="12" fill="#94A3B8">Open Source Contributions</text>
    <text x="448" y="286" class="gs-mono" font-size="9" fill="#94A3B8" fill-opacity="0.7">synced via GitHub API</text>
  </g>

  <!-- Tile 6 — Current Focus (cycling text, no numeric value) -->
  <g class="gs-tile d6">
    <rect x="800" y="208" width="352" height="92" rx="16" fill="#0D1117" fill-opacity="0.4" stroke="#94A3B8" stroke-opacity="0.14" stroke-width="1"/>
    <circle class="gs-icon-plate" cx="824" cy="234" r="15" fill="#4F46E5" fill-opacity="0.16"/>
    <circle cx="824" cy="234" r="11" fill="none" stroke="#06B6D4" stroke-width="1.4"/>
    <circle cx="824" cy="234" r="6.5" fill="none" stroke="#06B6D4" stroke-width="1.2" opacity="0.7"/>
    <circle cx="824" cy="234" r="2.2" fill="#06B6D4"/>
    <text x="850" y="230" font-size="12" fill="#94A3B8">Current Focus</text>
    <g class="gs-mono" font-size="12">
      <text x="824" y="256" fill="#06B6D4">&#10095;</text>
      <text x="838" y="256" class="gs-focusLine f1"><tspan fill="#F8FAFC">Scaling MERN products for SaaS &amp; blockchain</tspan><tspan class="gs-caret" fill="#06B6D4">&#9612;</tspan></text>
      <text x="838" y="256" class="gs-focusLine f2"><tspan fill="#F8FAFC">Designing RAG systems &amp; LLM integrations</tspan><tspan class="gs-caret" fill="#06B6D4">&#9612;</tspan></text>
      <text x="838" y="256" class="gs-focusLine f3"><tspan fill="#F8FAFC">Shipping agentic automation with n8n</tspan><tspan class="gs-caret" fill="#06B6D4">&#9612;</tspan></text>
      <text x="838" y="256" class="gs-focusLine f4"><tspan fill="#F8FAFC">Crafting immersive React + Three.js UI</tspan><tspan class="gs-caret" fill="#06B6D4">&#9612;</tspan></text>
    </g>
    <text x="824" y="286" font-size="9.5" fill="#94A3B8" fill-opacity="0.6">from active project focus areas</text>
  </g>

  <!-- ============================================================ -->
  <!-- Footer legend                                                 -->
  <!-- ============================================================ -->
  <text x="600" y="324" text-anchor="middle" class="gs-mono" font-size="10" fill="#94A3B8" fill-opacity="0.75">&#8212; marks a live value synced from the GitHub API &#183; other figures reflect production work on file</text>

</svg>
