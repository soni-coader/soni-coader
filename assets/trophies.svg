    <radialGradient id="trGlowAccent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
