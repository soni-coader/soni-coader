      <stop offset="45%" stop-color="#f8fafc" stop-opacity="0"/>
      <stop offset="52%" stop-color="#f8fafc" stop-opacity=".1"/>
      <stop offset="58%" stop-color="#06b6d4" stop-opacity=".07"/>
      <stop offset="65%" stop-color="#f8fafc" stop-opacity="0"/>
