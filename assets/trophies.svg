  <style>
    @keyframes trGlowBreathe{0%,to{opacity:.6}50%{opacity:1}}@keyframes trCardBreathe{0%,to{transform:scale(1)}50%{transform:scale(1.004)}}@keyframes trEnter{0%{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trBadgeIn{0%{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes trIconPulse{0%,to{opacity:.55}50%{opacity:.95}}@keyframes trRingGlint{0%,to{opacity:.35}50%{opacity:.75}}@keyframes trShine{0%{transform:translate(-260px,-260px);opacity:0}10%,55%{opacity:1}72%{opacity:0}to{transform:translate(260px,260px);opacity:0}}@keyframes trDriftA{0%,to{transform:translate(0,0);opacity:.25}50%{transform:translate(7px,-9px);opacity:.55}}@keyframes trDriftB{0%,to{transform:translate(0,0);opacity:.2}50%{transform:translate(-8px,7px);opacity:.5}}@keyframes trDriftC{0%,to{transform:translate(0,0);opacity:.22}50%{transform:translate(6px,9px);opacity:.5}}@keyframes trLivePulse{0%,to{opacity:.5}50%{opacity:1}}text{font-family:&quot;Segoe UI&quot;,&quot;Inter&quot;,Arial,sans-serif}.tr-mono{font-family:&quot;SFMono-Regular&quot;,&quot;Consolas&quot;,&quot;Courier New&quot;,monospace}.tr-glow-breathe{animation:trGlowBreathe 4.2s ease-in-out infinite}#trCardBreathe{transform-origin:600px 262px;animation:trCardBreathe 5.4s ease-in-out infinite}.tr-enter{opacity:0;animation:trEnter 700ms ease-out both}.tr-badge,.tr-icon-plate{transition:transform 200ms ease-out;transform-box:fill-box;transform-origin:center}.tr-badge{opacity:0;animation:trBadgeIn 650ms ease-out both}.tr-badge:hover{transform:translateY(-3px)}.tr-icon-plate{animation:trIconPulse 3.6s ease-in-out infinite}.tr-icon-plate:hover{transform:scale(1.1)}.tr-ring{animation:trRingGlint 4.5s ease-in-out infinite}.tr-shine{animation:trShine 7s ease-in-out infinite}.tr-p1{animation:trDriftA 12s ease-in-out infinite}.tr-p2{animation:trDriftB 15s ease-in-out infinite}.tr-p3{animation:trDriftA 10s ease-in-out infinite}.tr-p4{animation:trDriftB 13s ease-in-out infinite}.tr-p5{animation:trDriftC 16s ease-in-out infinite}.tr-p6{animation:trDriftC 11s ease-in-out infinite}.tr-live-pulse{animation:trLivePulse 3s ease-in-out infinite}
  </style>
