<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" aria-labelledby="trTitle trDesc" role="img" viewBox="0 0 1200 510">
  <title id="trTitle">Aryant Shrirang — Professional Achievements</title>
  <desc id="trDesc">
    Animated achievement badge card highlighting core engineering strengths: project delivery, AI automation, MERN stack, RAG &amp; LLM integration, blockchain, SaaS, full stack web, and creative UI/motion design.
